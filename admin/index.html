<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Snack Station | Staff Admin Login</title>
  <link rel="stylesheet" href="/css/staff-workspace.css" />
</head>
<body>
  <main class="login-shell">
    <div class="badge">Staff Access</div>
    <h1>Admin Login</h1>
    <p>Sign in with your approved staff account to open the admin workspace.</p>

    <form id="admin-login-form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="admin@thesnackstation.com" required />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" required />

      <button id="admin-login-submit" type="submit">Sign In</button>
      <div id="admin-login-status" class="status" aria-live="polite"></div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDbEYx361Xg3KfHoghlHAYTC-b8g6Yy2I8',
      authDomain: 'thesnackstation-c6ff9.firebaseapp.com',
      projectId: 'thesnackstation-c6ff9',
      storageBucket: 'thesnackstation-c6ff9.firebasestorage.app',
      messagingSenderId: '830977242508',
      appId: '1:830977242508:web:cac072840fc4c9366c12a9',
      measurementId: 'G-V404QLEB66'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById('admin-login-form');
    const submitButton = document.getElementById('admin-login-submit');
    const status = document.getElementById('admin-login-status');

    function setStatus(message, kind = '') {
      status.textContent = message;
      status.className = `status ${kind}`.trim();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        setStatus('Please enter both email and password.', 'error');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';
      setStatus('Connecting to staff authentication...');

      try {
        // 1. Authenticate user credentials
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        setStatus('Verifying staff permissions...');

        // 2. Fetch user profile from Firestore to check permissions
        const userDocRef = doc(db, 'users', user.uid);
        const userDoc = await getDoc(userDocRef);

        if (userDoc.exists() && userDoc.data().role === 'admin') {
          setStatus('Authenticated. Opening the admin workspace...', 'success');
          
          // 3. Redirect directly to the workspace view page (adjust path if needed)
          window.location.replace('./staff-workspace.html');
        } else {
          // Reject non-admin users attempting to log in through the staff portal
          await signOut(auth);
          setStatus('Access denied. Account is not registered as staff/admin.', 'error');
        }

      } catch (error) {
        const friendlyError = {
          'auth/invalid-email': 'Please enter a valid staff email address.',
          'auth/user-not-found': 'No staff account was found for that email.',
          'auth/wrong-password': 'Incorrect password. Please try again.',
          'auth/invalid-credential': 'Invalid email or password. Please try again.',
          'auth/too-many-requests': 'Too many attempts. Please try again in a moment.'
        };
        setStatus(friendlyError[error.code] || error.message || 'Could not sign in to the admin workspace.', 'error');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
